<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#D93A6B"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <!-- 后面那条：Bot 的回复，半透明、像正在消失 -->
  <g opacity="0.38">
    <rect x="98" y="46" width="112" height="78" rx="22" fill="#FFFFFF"/>
    <path d="M182 120 L200 142 L168 122 Z" fill="#FFFFFF"/>
  </g>

  <!-- 前面那条：用户的消息气泡 -->
  <rect x="44" y="86" width="140" height="102" rx="28" fill="#FFFFFF"/>
  <path d="M72 182 L58 214 L104 184 Z" fill="#FFFFFF"/>

  <!-- 撤回箭头 -->
  <path d="M90 128 H136 a22 22 0 0 1 0 44 H112"
        fill="none" stroke="#D93A6B" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M106 108 L84 128 L106 148"
        fill="none" stroke="#D93A6B" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
